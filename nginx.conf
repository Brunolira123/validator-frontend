server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Fotos de celular: o backend aceita até 20MB (spring.servlet.multipart.*)
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # DNS interno do Docker. Resolver por variável (em vez de upstream fixo) faz o nginx
    # subir mesmo com o backend fora do ar e acompanhar o IP novo quando ele reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Endpoints de debug do backend: chamam API paga (Gemini), não podem ficar expostos.
    # Location regex tem precedência sobre o prefixo /api/ abaixo.
    location ~ ^/api/(vision|motor)(/|$) {
        return 404;
    }

    location /api/ {
        # Sem URI no proxy_pass: o caminho /api/... vai intacto (o backend já usa /api)
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Análise com IA pode levar dezenas de segundos
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Upload vai direto pro backend, sem bufferizar em disco no nginx
        proxy_request_buffering off;
    }

    # Healthcheck do container (não loga)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets do Vite têm hash no nome: cache longo é seguro.
    # (add_header num location anula os do server — por isso os headers se repetem abaixo)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Service worker, manifest e index.html nunca podem ficar presos em cache,
    # senão o PWA não recebe versão nova depois do deploy
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota do React Router cai no index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
